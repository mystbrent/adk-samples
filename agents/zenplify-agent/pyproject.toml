[tool.poetry]
name = "zenplify-agent"
version = "0.1.0"
description = "AI-powered agent built using Google's Python Agent Development Kit (ADK) to assist technology professionals in streamlining the job application process"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
google-adk = "^0.0.8"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
python-dotenv = "^1.0.0"
alembic = "^1.12.0"
sqlalchemy = "^2.0.21"
psycopg2-binary = "^2.9.7"
pgvector = "^0.2.3"
PyMuPDF = "^1.23.3"
python-docx = "^0.8.11"
spacy = "^3.7.2"
PyGithub = "^2.1.1"
requests = "^2.31.0"
google-cloud-aiplatform = "^1.36.1"
litellm = "^0.10.1"
numpy = "^1.26.0"
scikit-learn = "^1.3.1"
cryptography = "^41.0.4"
pyjwt = "^2.8.0"
loguru = "^0.7.2"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "src.main:run_app" 